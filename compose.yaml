name: is373-ci-cd

services:
  dev:
    build:
      context: .
    image: is373-ci-cd-dev:local
    ports:
      - "127.0.0.1:${DEV_PORT:-8080}:8000"
    environment:
      APP_ENV: development
    volumes:
      - ./app:/app/app:ro
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000", --reload]
    labels:
      wud.watch: "false"
    restart: unless-stopped

  prod:
    image: ${PROD_IMAGE:-pb392/is373_ci_cd:prod}
    ports:
      - "127.0.0.1:8090:8000"
    environment:
      APP_ENV: production
    restart: unless-stopped
    labels:
      wud.watch: "true"
      wud.watch.digest: "true"
      wud.tag.include: "^prod$$"
      wud.trigger.include: docker.production

  wud:
    image: getwud/wud:9.0.2@sha256:257b2221f201a0231db295b662882c5873ff72dc687be94dbae2e15f5394f151
    ports:
      - "127.0.0.1:8091:3000"
    env_file:
      - path: ./.state/wud.env
        required: false
    environment:
      WUD_WATCHER_LOCAL_WATCHBYDEFAULT: "false"
      WUD_WATCHER_LOCAL_WATCHDIGESTDEFAULT: "true"
      WUD_WATCHER_LOCAL_CRON: "* * * * *"
      WUD_WATCHER_LOCAL_JITTER: "1000"
      WUD_TRIGGER_DOCKER_PRODUCTION_AUTO: "true"
      WUD_TRIGGER_DOCKER_PRODUCTION_PRUNE: "false"
      WUD_TRIGGER_DOCKER_PRODUCTION_DRYRUN: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - wud-data:/store
    labels:
      wud.watch: "false"
    restart: unless-stopped

volumes:
  wud-data:
